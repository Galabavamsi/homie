name: homie-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homie
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie
    ports:
      - "5432:5432"
    volumes:
      - homie_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie -d homie"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - homie_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  homie_postgres:
  homie_redis:
